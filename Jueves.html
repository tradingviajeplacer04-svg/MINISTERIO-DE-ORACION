<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Encuentro de Oración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&display=swap');

        body {
            background-color: #2a0a0a; /* Fondo burdeo un poco más vibrante */
            color: #fff5e6;
            font-family: 'Montserrat', sans-serif;
        }

        .church-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.15em;
        }

        /* Degradado más luminoso: Oro a Carmesí Claro */
        .gradient-text {
            background: linear-gradient(to bottom, #ffea70, #e63946, #800000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .wine-glow {
            box-shadow: 0 0 50px rgba(230, 57, 70, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .flame-container {
            position: relative;
            height: 90px;
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        /* Llama con colores más vivos y claros */
        .flame {
            position: absolute;
            bottom: 0;
            width: 35px;
            height: 35px;
            background: #e63946;
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg);
            filter: blur(4px);
            animation: flicker 1.6s infinite alternate ease-in-out;
            opacity: 0.9;
        }

        @keyframes flicker {
            0% { transform: rotate(-45deg) scale(1); opacity: 0.9; }
            100% { transform: rotate(-45deg) scale(1.2) translateY(-12px); opacity: 0.6; }
        }

        .card {
            background: linear-gradient(180deg, #4a1010 0%, #2a0808 100%);
            max-width: 450px;
            width: 90%;
            margin: 2rem auto;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #631616;
        }

        .zoom-badge {
            background-color: #2D8CFF; /* Azul oficial de Zoom */
            color: white;
            padding: 6px 16px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.875rem;
            box-shadow: 0 4px 15px rgba(45, 140, 255, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="card wine-glow relative p-10 text-center">
        
        <!-- Elemento Visual: Llama más clara -->
        <div class="flame-container">
            <div class="flame" style="background: #800000; width: 60px; height: 60px; filter: blur(10px);"></div>
            <div class="flame" style="background: #e63946; width: 45px; height: 45px; animation-delay: 0.3s;"></div>
            <div class="flame" style="background: #ff7070; width: 30px; height: 30px; animation-delay: 0.6s; filter: blur(2px);"></div>
            <div class="flame" style="background: #ffffff; width: 12px; height: 12px; animation-delay: 0.1s; filter: blur(1px); opacity: 0.6;"></div>
        </div>

        <h2 class="church-title text-xs text-yellow-400 mb-2 uppercase font-semibold">Reunión de</h2>
        <h1 class="text-5xl font-bold mb-8 gradient-text uppercase tracking-widest">Oración</h1>

        <div class="space-y-4 mb-10">
            <div class="flex items-center justify-center space-x-4 text-xl font-light text-white">
                <span class="h-px w-6 bg-yellow-500/50"></span>
                <span class="tracking-[0.2em]">JUEVES</span>
                <span class="h-px w-6 bg-yellow-500/50"></span>
            </div>
            <p class="text-4xl font-semibold text-white">20:00 <span class="text-xl font-normal text-white-200/70">HRS</span></p>
            
            <!-- Botón con Logo de Zoom -->
            <div class="zoom-badge mt-4">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0a12 12 0 1012 12A12.014 12.014 0 0012 0zm6.544 15.11a1.272 1.272 0 01-1.127 1.258 8.441 8.441 0 01-4.757-.145 1.272 1.272 0 01-.84-1.22V11.23a1.272 1.272 0 01.84-1.22 8.441 8.441 0 014.757-.145 1.272 1.272 0 011.127 1.258v3.987zm-7.904-4.526l-.01.002v2.828l.01.002a2.033 2.033 0 002.023 2.023h.001a2.033 2.033 0 002.023-2.023v-2.828a2.033 2.033 0 00-2.023-2.023h-.001a2.033 2.033 0 00-2.023 2.023z"/>
                </svg>
                POR ZOOM
            </div>
        </div>

        <!-- Cita Bíblica -->
        <div class="relative py-8 px-6 bg-white/5 rounded-xl border-t border-b border-white/10 mb-8">
            <p class="italic text-lg text-white leading-relaxed">
                "El fuego arderá continuamente en el altar; no se apagará."
            </p>
            <div class="mt-4 flex flex-col items-center">
                <div class="h-0.5 w-10 bg-yellow-400 mb-2"></div>
                <p class="font-bold text-yellow-400 tracking-widest text-sm uppercase">Levítico 6:13</p>
            </div>
        </div>

        <p class="text-white/70 text-sm leading-relaxed mb-8 px-4">
            Mantengamos juntos el altar encendido en comunidad. Una invitación para buscar Su rostro.
        </p>

        <!-- ACYM REÑACA en Blanco Puro -->
        <div class="pt-6 border-t border-white/10 text-[14px] tracking-[0.3em] text-white font-bold">
            ACYM REÑACA
        </div>

    </div>

</body>
</html>
